<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="370" viewBox="0 0 1160 370"><rect width="1160" height="370" rx="24" fill="#EDF8FC"/><g font-family="Arial, sans-serif" fill="#173047"><text x="40" y="55" font-size="28" font-weight="bold">From screenshots to a reviewable tutorial</text><rect x="40" y="100" width="240" height="175" rx="20" fill="white" stroke="#B6CFDF"/><text x="58" y="139" font-size="20" font-weight="bold">1. Prepare</text><text x="58" y="175" font-size="16" fill="#52677A">Keep originals read-only</text><text x="58" y="202" font-size="16" fill="#52677A">Use verified safe copies</text><text x="58" y="229" font-size="16" fill="#52677A">Plan the actual user flow</text><path d="M285 185 h20 l-6 -5 m6 5 l-6 5" stroke="#F97316" fill="none" stroke-width="3"/><rect x="310" y="100" width="240" height="175" rx="20" fill="white" stroke="#B6CFDF"/><text x="328" y="139" font-size="20" font-weight="bold">2. Annotate</text><text x="328" y="175" font-size="16" fill="#52677A">Use original pixel coordinates</text><text x="328" y="202" font-size="16" fill="#52677A">Protect essential text</text><text x="328" y="229" font-size="16" fill="#52677A">Connect action labels</text><path d="M555 185 h20 l-6 -5 m6 5 l-6 5" stroke="#F97316" fill="none" stroke-width="3"/><rect x="580" y="100" width="240" height="175" rx="20" fill="white" stroke="#B6CFDF"/><text x="598" y="139" font-size="20" font-weight="bold">3. Verify</text><text x="598" y="175" font-size="16" fill="#52677A">Check collisions and bounds</text><text x="598" y="202" font-size="16" fill="#52677A">Check hashes and metadata</text><text x="598" y="229" font-size="16" fill="#52677A">Split oversized overviews</text><path d="M825 185 h20 l-6 -5 m6 5 l-6 5" stroke="#F97316" fill="none" stroke-width="3"/><rect x="850" y="100" width="240" height="175" rx="20" fill="white" stroke="#B6CFDF"/><text x="868" y="139" font-size="20" font-weight="bold">4. Review</text><text x="868" y="175" font-size="16" fill="#52677A">Open images and crops</text><text x="868" y="202" font-size="16" fill="#52677A">Inspect full overview</text><text x="868" y="229" font-size="16" fill="#52677A">Record a human decision</text><text x="40" y="325" font-size="16">Concept diagram / 流程示意：automatic QA ends at awaiting_manual_review.</text></g></svg>